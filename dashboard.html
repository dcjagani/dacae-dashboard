<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DACAE Control Center - 5-Star NABH/QCI Compliant Ecosystem</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        el.classList.add('bg-slate-900', 'text-slate-300', 'border-slate-800');
      });
      document.getElementById(tabId).classList.remove('hidden');
      const activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.remove('bg-slate-900', 'text-slate-300', 'border-slate-800');
      activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between">

  <!-- Header / Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-lg">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-wide">DACAE Control Center</h1>
          <p class="text-[11px] text-slate-400">Dynamic Autonomous Cloud-native AI Ecosystem | 5-Star NABH & QCI Compliant</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="live-datetime" class="px-3 py-1 bg-slate-950 text-slate-300 text-xs font-mono rounded-full border border-slate-800 flex items-center gap-1.5">
          <i class="fa-regular fa-clock text-indigo-400"></i> Loading Live Time...
        </span>
        <span class="px-3 py-1 bg-indigo-950 text-indigo-400 text-xs font-semibold rounded-full border border-indigo-800 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> NABH / QCI / IMF Compliant
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Area with Interactive Tabs -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    
    <!-- Tab Navigation Buttons Bar -->
    <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
      <button onclick="switchTab('tab-hub')" id="btn-tab-hub" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg border bg-indigo-600 text-white border-indigo-500 transition flex items-center gap-2">
        <i class="fa-solid fa-network-wired"></i> 1. Master Hub
      </button>
      <button onclick="switchTab('tab-vitals')" id="btn-tab-vitals" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg border bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-user-doctor"></i> 2. KYC & Vitals
      </button>
      <button onclick="switchTab('tab-labs')" id="btn-tab-labs" class="tab-btn px-4 py-2 text-xs font-semibold rounded-lg border bg-slate-900 text-slate-300
